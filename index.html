<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f3ee">
	<title>YDict | Dictionary</title>
	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>
<body>
	<header class="site-header">
		<a class="wordmark" href="./" aria-label="YDict home">Y<span>.</span>DICT</a>
		<nav id="alphabet-index" class="alphabet-nav" aria-label="Jump to words by first letter"></nav>
	</header>

	<main class="dictionary">
		<div class="search-row">
			<label class="search-control" for="dictionary-search">
				<span>Search dictionary</span>
				<input id="dictionary-search" type="search" placeholder="Word, definition, example, or tag" autocomplete="off">
			</label>
				<div id="active-filters" class="active-filters" aria-live="polite"></div>
		</div>
		<section class="entries-section" aria-labelledby="entries-heading">
			<div class="section-heading">
				<h1 id="entries-heading">Dictionary</h1>
				<p id="entry-count" class="entry-count" aria-live="polite">Loading entries…</p>
			</div>
			<div id="entries" class="entries" aria-live="polite">
				<p class="status-message">Opening the dictionary…</p>
			</div>
		</section>
	</main>

	<footer class="site-footer">
		<span>YDict</span>
	</footer>
</body>
</html>
